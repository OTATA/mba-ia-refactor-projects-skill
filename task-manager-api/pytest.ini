[pytest]
testpaths = tests
# Trata warning de API depreciada como erro: é o que impede a reintrodução de
# `datetime.utcnow()` e `Query.get()`, corrigidos nesta refatoração.
filterwarnings =
    error::DeprecationWarning
    error::sqlalchemy.exc.LegacyAPIWarning
    error::sqlalchemy.exc.MovedIn20Warning
